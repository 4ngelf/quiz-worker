name: ESTUDIO DE MERCADO SOBRE MATERIAL MÉDICO QUIRÚRGICO
description: |
  Encuesta dirigida a responsables de compras de instituciones de salud

  Objetivo: Conocer necesidades, criterios de selección, oportunidades de mejora y condiciones actuales de adquisición de material médico quirúrgico en instituciones de salud públicas y privadas.

  Estimado(a):

  Estamos realizando un estudio de mercado con el propósito de conocer las necesidades y criterios utilizados en la adquisición de material médico quirúrgico, así como identificar oportunidades de mejora en el suministro de estos productos.

  La información suministrada será utilizada únicamente con fines de investigación de mercado y será manejada de forma confidencial.

  Tiempo estimado de respuesta: 5 minutos.

  Agradecemos su valiosa colaboración.

questions:
  - type: multiple
    question: ¿Qué tipo de institución representa?
    body_text: null
    img_url: null
    max_options: 1
    options:
      - text_value: Clínica privada
      - text_value: Hospital público
      - text_value: Centro ambulatorio
      - text_value: Distribuidor de insumos médicos
      - text_value: Otro
        is_alternative: true

  - type: multiple
    question: ¿Cuáles categorías de material médico quirúrgico adquiere con mayor frecuencia?
    body_text: Puede seleccionar varias opciones
    img_url: null
    max_options: 9
    options:
      - text_value: Apósitos y material para curación
      - text_value: Gasas y compresas
      - text_value: Jeringas y agujas
      - text_value: Catéteres intravenosos (Yelcos)
      - text_value: Guantes
      - text_value: Kits quirúrgicos
      - text_value: Suturas
      - text_value: Otros
        is_alternative: true

