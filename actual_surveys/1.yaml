    question: ¿Qué tipo de institución representa?
    body_text: null
    img_url: null
    max_options: 1
    options:
      - text_value: Clínica privada
      - text_value: Hospital público
      - text_value: Centro ambulatorio
      - text_value: Distribuidor de insumos médicos
      - text_value: Otro
        is_alternative: true
  
