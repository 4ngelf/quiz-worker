name: ESTUDIO DE MERCADO SOBRE MATERIAL MÉDICO QUIRÚRGICO
description: |
  Encuesta dirigida a responsables de compras de instituciones de salud
  
  Estimado(a):

  Nos encontramos realizando un estudio de mercado con el propósito de conocer las necesidades, criterios de selección y oportunidades de mejora relacionadas con el suministro de material médico quirúrgico en instituciones de salud públicas y privadas.

  La información suministrada será utilizada únicamente con fines de investigación de mercado y será tratada de forma confidencial.

  Tiempo estimado de respuesta: 5 minutos.

  Agradecemos sinceramente su colaboración.

